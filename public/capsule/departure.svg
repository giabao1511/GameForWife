<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Lá thư ngày lên đường">
  <defs>
    <linearGradient id="capbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e2cf"/>
      <stop offset="1" stop-color="#cdbd94"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9743d"/>
      <stop offset="1" stop-color="#b6572e"/>
    </linearGradient>
  </defs>

  <!-- soft sky + warm ground -->
  <rect width="400" height="300" fill="url(#capbg)"/>
  <circle cx="322" cy="70" r="30" fill="#f6e7cf" opacity="0.8"/>
  <ellipse cx="200" cy="250" rx="210" ry="44" fill="#b98a5a" opacity="0.5"/>

  <!-- a small truck leaving town (silhouette) -->
  <g transform="translate(70,196)">
    <rect x="0" y="0" width="86" height="34" rx="8" fill="url(#flag)"/>
    <rect x="62" y="10" width="30" height="24" rx="6" fill="#8a5a33"/>
    <circle cx="22" cy="38" r="9" fill="#3d3327"/>
    <circle cx="66" cy="38" r="9" fill="#3d3327"/>
    <circle cx="86" cy="38" r="8" fill="#3d3327"/>
    <!-- waving flag on the cab -->
    <line x1="92" y1="-6" x2="92" y2="16" stroke="#4a3f35" stroke-width="3"/>
    <path d="M92 -6 h26 l-6 6 6 6 h-26 z" fill="#e5484d"/>
  </g>

  <!-- heart floating from the truck -->
  <path d="M250 150 c-8 -12 -24 -7 -24 7 c0 11 14 17 24 24 c10 -7 24 -13 24 -24 c0 -14 -16 -19 -24 -7 z" fill="#e5484d" opacity="0.9"/>

  <text x="200" y="284" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#6b5a45">ngày lên đường · thay ảnh thật tại public/capsule/</text>
</svg>
